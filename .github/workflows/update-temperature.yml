name: Update temperature data

on:
  schedule:
    - cron: "30 3 * * 1,4"   # Monday and Thursday 03:30 UTC, after the snow update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas pyarrow requests

      - name: Fetch the last days and add them to the recent file
        run: python scripts/update_temperature.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_clean/daily_temp_recent.parquet
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update temperature data"
            git pull --rebase
            git push
          fi