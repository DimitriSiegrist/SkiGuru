name: Update ski pass prices

on:
  schedule:
    - cron: "0 2 * * 3"   # every Wednesday 02:00 UTC (03:00 Swiss time)
  workflow_dispatch:      # also allows a manual start on GitHub

permissions:
  contents: write         # the Action may commit to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # a full run takes ~45 min; stop if it hangs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Scrape prices
        run: python scripts/scrape_prices.py

      - name: Commit if changed
        if: always()      # commit the resorts that worked, even if one failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_clean/prices.csv logs/scrape_prices_log.csv
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update ski pass prices"
            git pull --rebase   # main may have changed during the ~45 min run (e.g. a merge)
            git push
          fi